# Increase Gradle build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false

# Android build
android.useAndroidX=true
android.enableJetifier=false

# AGP compat flags
# android.testHighAccuracyTimestamp: suppress Java version warning
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Skip Java version check in AGP (undocumented but effective in 8.5+)
# This env var is checked in VersionCheckPlugin
org.gradle.jvm.version=21
