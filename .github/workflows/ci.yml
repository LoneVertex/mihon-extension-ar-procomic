name: CI Build

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master, 'fix/**']

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Run deterministic contract tests
        run: |
          for test in $(find testdata -type f -name 'test_*.py' | sort); do
            python3 "$test" || exit 1
          done
          git diff --check

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Debug Keystore Signed)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: procomic-extension-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
